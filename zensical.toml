# Documentation site for this project. Preview: zensical serve; check: zensical build --strict
[project]
site_name = "AECPilot"
docs_dir = "docs"
site_dir = "site"
# Every page must be listed here. A bare path takes its title from the page's heading;
# a section is { "Section title" = [ "folder/page.md", ... ] }.
nav = [
  "index.md",
  "PRODUCT.md",
  { "Архитектура" = [
    "ARCHITECTURE.md",
    { "Решения" = [
      "decisions/index.md",
      "decisions/0001-core-without-fork.md",
      "decisions/0002-donor-ui-in-our-shell.md",
      "decisions/0003-desktop-stack.md",
      "decisions/0004-files-first-storage.md",
      "decisions/0005-two-tier-indexing.md",
      "decisions/0006-memory-mem0.md",
      "decisions/0007-roster-donor-plugin.md",
      "decisions/0008-server-client-profiles.md",
      "decisions/0009-single-install-directory.md",
      "decisions/0010-packaging-nsis-payload.md",
      "decisions/0011-schedule-tick-in-main.md",
      "decisions/0012-core-0-22-2.md",
      "decisions/0013-user-chosen-provider.md",
      "decisions/0014-credentials-storage.md",
      "decisions/0015-licensing.md",
    ] },
  ] },
  "TASKS.md",
  { "История" = [
    "history/index.md",
    "history/stage-1.md",
    "history/stage-2.md",
    "history/stage-3.md",
    "history/id-changes.md",
    "history/deferred.md",
    "history/plan.md",
    { "Контракты функций" = [
      "history/specs/index.md",
      "history/specs/workspace-sources.md",
      "history/specs/qa-over-sources.md",
      "history/specs/wiki.md",
      "history/specs/agent-chat.md",
      "history/specs/agent-sessions.md",
      "history/specs/agent-skills.md",
      "history/specs/agent-memory.md",
      "history/specs/agent-roster.md",
      "history/specs/checkpoints-rollback.md",
      "history/specs/workbench-panels.md",
      "history/specs/external-surfaces.md",
      "history/specs/docgen.md",
      "history/specs/id-check.md",
    ] },
  ] },
]

[project.theme]
language = "ru"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.palette]
scheme = "slate"
primary = "indigo"
accent = "amber"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
# Code is embedded from the project's own files, so it never goes stale.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
# Terms defined in docs/.terms.md show their meaning on hover on every page.
pymdownx.snippets.auto_append = ["docs/.terms.md"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
