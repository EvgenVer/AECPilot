[project]
name = "aec-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Declared here rather than inherited from the workspace: `server.py` imports
    # `mcp.server` directly, and a package must not rest on another package's
    # dependency tree (same rule the root pyproject states for anyio). Range,
    # not a pin — we speak a protocol to the core over stdio, not an ABI; the
    # floor is 2 because `mcp.server.fastmcp` was removed in 2.0 (task 3.B0б).
    "mcp>=2,<3",
    "docling>=2.118.1,<3",
    "lightrag-hku>=1.5.6,<2",
    # LightRAG keeps `openai` in an optional extra and pulls it in at runtime
    # with `pipmaster` (pip-install-on-demand) when a binding needs it. We
    # declare it ourselves so nothing ever installs into the venv behind our
    # back — see PLAN §Risks R15.
    "openai>=2,<3",
    # OCR backend chosen by the measurement in task 2.2 (PLAN §Risks R4):
    # RapidOCR's `eslav` model runs on onnxruntime. Declared directly rather
    # than through docling's `onnxruntime` extra — on Windows that extra
    # resolves to `onnxruntime-gpu`, which wants CUDA.
    "onnxruntime>=1.7,<1.24",
    # Two-speed PDF ingest (task 3H.13, PLAN §3H item C): the text layer is read
    # page by page with pypdfium2, and a page without a usable layer is rendered
    # by it for recognition. Both arrived with Docling already; declared because
    # we now import them ourselves. numpy carries the rendered page to RapidOCR.
    "pypdfium2>=5.12,<6",
    "numpy>=2,<3",
]

[project.scripts]
aec-rag = "aec_rag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
