[project]
name = "aec-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "docling>=2.118.1,<3",
    "lightrag-hku>=1.5.6,<2",
    # LightRAG keeps `openai` in an optional extra and pulls it in at runtime
    # with `pipmaster` (pip-install-on-demand) when a binding needs it. We
    # declare it ourselves so nothing ever installs into the venv behind our
    # back — see PLAN §Risks R15.
    "openai>=2,<3",
    # OCR backend chosen by the measurement in task 2.2 (PLAN §Risks R4):
    # RapidOCR's `eslav` model runs on onnxruntime. Declared directly rather
    # than through docling's `onnxruntime` extra — on Windows that extra
    # resolves to `onnxruntime-gpu`, which wants CUDA.
    "onnxruntime>=1.7,<1.24",
]

[project.scripts]
aec-rag = "aec_rag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
