packages:
  - apps/*

# Security review of phase 2 (task 2.19): `mermaid` and its `dompurify` arrive
# in the SHIPPED bundle through `@assistant-ui/react-streamdown > streamdown`,
# and they render text an agent wrote out of somebody's documents — prototype
# pollution, CSS injection and a DoS loop are reachable from exactly the input
# we cannot vouch for. Pulled up to the patched versions here rather than
# waiting for streamdown to bump its own range.
overrides:
  mermaid: '>=11.16.1'
  dompurify: '>=3.4.13'
  # Task 4D-17. Both are patch bumps inside the major their parents already
  # depend on, so nobody's range is being forced open. `brace-expansion` rides
  # in on exceljs (three separate majors: archiver's glob chain, readdir-glob,
  # and typescript-eslint's minimatch) and `nanoid` on postcss under vue —
  # every advisory is the same unbounded-expansion DoS class.
  brace-expansion@1: '^1.1.18'
  brace-expansion@2: '^2.1.4'
  brace-expansion@5: '^5.0.9'
  nanoid@3: '^3.3.18'
  # Same task, dev half: patch/minor bumps inside the major each parent already
  # asks for. postcss and js-yaml ride in on vite and eslint, undici on electron
  # and jsdom. None of the three reaches the shipped bundle, but a finding
  # nobody looks at is a finding nobody sees change.
  postcss@8: '^8.5.23'
  undici@7: '^7.29.0'
  js-yaml@4: '^4.3.1'

# `unicode-animations` ships a postinstall that prints a spinner demo to
# /dev/tty for three seconds. Harmless (read the script: no network, no writes)
# and useless to us, so it stays unbuilt — recorded here rather than left as a
# warning, because a standing warning is a decision nobody made.
# Task 4D-17. The one advisory left after the bumps above, kept with its reason
# rather than left to be re-discovered by whoever runs the audit next.
#
# GHSA-w5hq-g745-h8pq — uuid@8.3.2, reached only as exceljs>uuid. The flaw is a
# missing bounds check in v3/v5/v6 WHEN A BUFFER IS PASSED; exceljs calls
# `v4()` with no arguments, in one file on the WRITE path
# (`xlsx/xform/sheet/cf-ext/cf-rule-ext-xform.js`), and we only read. Fixing it
# means forcing uuid 8 → 11 on a transitive dependency — three majors, in a code
# path our tests never execute, to close a hole that is not reachable. Recheck
# when exceljs widens its own range.
#
# Владелец решения: владелец проекта. Пересматривать не по календарю, а по
# двум проверяемым поводам (находка D-55): перед выпуском (фаза 6) и при
# каждом подъёме exceljs. Дата в комментарии протухла бы молча, а эти два
# повода видно в работе.
#
# Лицензии, проверенные руками тогда же (D-55):
#   khroma@2.1.0  — MIT. В пакете лежит файл `license` с полным текстом;
#                   поля `license` в package.json просто нет.
#   buffers@0.1.1 — ЛИЦЕНЗИИ НЕТ ВООБЩЕ: ни поля, ни файла, ни строки в
#                   README. Едет в ПОСТАВКУ: exceljs > unzipper > binary >
#                   buffers. Это не «метаданные потерялись», это
#                   неопределённое право на код, который мы раздаём.
#                   Решение за владельцем — принять, вычистить или уйти с
#                   exceljs; здесь записан только замер.
#
#                   АПСТРИМ ПРОВЕРЕН 2026-08-26 по решению владельца, и он
#                   ответа не дал: github.com/substack/node-buffers отвечает
#                   404, а в реестре npm поля лицензии нет НИ В ОДНОЙ версии.
#                   Версия всего одна, 0.1.1, опубликована 12.10.2011 и с тех
#                   пор не трогалась. То есть лицензии не существует нигде, а
#                   не «метаданные потеряли»: спрашивать больше некого и негде.
#                   Остаётся выбор владельца — принять как есть или уйти с
#                   exceljs; до этого выбора пакет едет в поставку без прав.
auditConfig:
  ignoreGhsas:
    - GHSA-w5hq-g745-h8pq

allowBuilds:
  unicode-animations: false

minimumReleaseAgeExclude:
  - '@assistant-ui/core@0.2.23'
  - '@assistant-ui/react@0.14.29'
  - '@assistant-ui/store@0.2.22'
  - '@assistant-ui/tap@0.9.6'
  - assistant-cloud@0.1.37
  - assistant-stream@0.3.28
  - safe-content-frame@0.0.25

onlyBuiltDependencies:
  - electron
  - esbuild
