name: aec-secret-filter
# `kind` ОБЯЗАН стоять здесь явно, и это не формальность (замерено 2026-09-09).
# Без него ядро угадывает вид плагина ПОДСТРОКОЙ в первых 8 КБ `__init__.py`
# (`_detect_kind_from_source`): встретив `MemoryProvider` — хоть в коде, хоть в
# комментарии, — он объявляет плагин ЧУЖИМ провайдером памяти, не грузит модуль
# и не вешает ни одного хука. Фильтр при этом выглядит установленным: папка на
# месте, строка в `plugins.enabled` на месте, `enabled: false` видно только в
# списке плагинов. Нас это поймало ровно так: упоминание их класса
# `Mem0MemoryProvider` в пояснении обнулило хуки. Явный `kind` отключает угадывание.
kind: standalone
version: "0.1.0"
description: "Отказывает в записи в память, когда в тексте видно значение секрета — ключ, токен, пароль, закрытый ключ. Достаёт оба слоя сразу: встроенный `memory` и `mem0_*` провайдера. Задача 5.3, спека specs/agent-memory.md."
author: "AECPilot"
hooks:
  - pre_tool_call
