[project]
name = "aecpilot"
version = "0.0.0"
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp/*"]

[tool.uv.sources]
aec-sources = { workspace = true }
aec-rag = { workspace = true }

[dependency-groups]
# python-docx and openpyxl build the DOCX/XLSX test fixtures. Both already
# arrive transitively with docling, but a test must not rest on somebody else's
# dependency tree — that is the trap recorded as D-6.
# python-docx, openpyxl and pillow build the test fixtures. All three arrive
# transitively with docling, but a test must not rest on somebody else's
# dependency tree — that is the trap recorded as D-6.
# `easyocr` is deliberately NOT here: it lost the measurement in 2.2 and costs
# a few hundred megabytes. To reproduce its row of eval/ocr-report.md, install
# it for the run — `uv run --with easyocr python eval/ocr_bench.py`.
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "pillow>=10,<13",
    "aec-sources",
    "aec-rag",
]

[tool.pytest.ini_options]
testpaths = ["mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
