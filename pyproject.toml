[project]
name = "aecpilot"
version = "0.0.0"
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp/*"]

[tool.uv.sources]
aec-sources = { workspace = true }
aec-rag = { workspace = true }

[dependency-groups]
# python-docx and openpyxl build the DOCX/XLSX test fixtures. Both already
# arrive transitively with docling, but a test must not rest on somebody else's
# dependency tree — that is the trap recorded as D-6.
# onnxruntime and easyocr exist for the OCR engine measurement (task 2.2) and
# nothing else. Whichever engine wins is promoted to a runtime dependency of
# aec-rag in 2.3; the losers are dropped from here.
# `onnxruntime` is declared directly rather than via docling's `onnxruntime`
# extra: on Windows that extra resolves to `onnxruntime-gpu`, which wants CUDA.
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "onnxruntime>=1.7,<1.24",
    "easyocr>=1.7,<2",
    "aec-sources",
    "aec-rag",
]

[tool.pytest.ini_options]
testpaths = ["mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
