[project]
name = "aecpilot"
version = "0.0.0"
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp/*"]

[tool.uv.sources]
aec-sources = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "aec-sources"]

[tool.pytest.ini_options]
testpaths = ["mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
