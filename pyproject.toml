[project]
name = "aecpilot"
version = "0.0.0"
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false
# Task T43.1 (owner decision 2026-10-22): `docling` is the all-in-one build and drags in
# its PDF models' stack, which our servers never run — PDFs are read by pdfium and
# scans by RapidOCR on onnxruntime (parse.py). Measured with every module below blocked
# from import: the MCP and plugin suites pass, and nothing but `torch` is even reached —
# Docling asks it which device to use for RapidOCR, and parse.py answers that itself.
# The packages stay out of the lock, so the tests run on exactly what the installer ships.
# Saves ~25 000 files of the installed tree.
exclude-dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "tokenizers",
    "safetensors",
    "accelerate",
    "huggingface-hub",
    "hf-xet",
    "faker",
    "polyfactory",
    "jsonlines",
    "dill",
    "multiprocess",
    "mpire",
    "semchunk",
    "tree-sitter",
    "tree-sitter-c",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "setuptools",
    "jinja2",
    "markupsafe",
    "filelock",
    "fsspec",
]

[tool.uv.workspace]
members = ["mcp/*"]

[tool.uv.sources]
aec-sources = { workspace = true }
aec-rag = { workspace = true }
aec-roster = { workspace = true }

[dependency-groups]
# python-docx, openpyxl and pillow build the test fixtures; `anyio` carries the
# pytest plugin every async test here rests on (`@pytest.mark.anyio`). All four
# arrive transitively anyway — the fixtures with docling, anyio with the MCP SDK
# — but a test must not rest on somebody else's dependency tree. The anyio case
# is the sharp one: with no plugin, `async def` tests do not fail, they stop
# running, and the suite still reports green. `--strict-markers` below is the
# mechanical half of the guard — no plugin means the `anyio` marker is
# unregistered and the whole run errors out instead of quietly shrinking.
# `easyocr` is deliberately NOT here: it lost the measurement in 2.2 and costs
# a few hundred megabytes. To reproduce its row of eval/ocr-report.md, install
# it for the run — `uv run --with easyocr python eval/ocr_bench.py`.
dev = [
    "pytest>=8,<10",
    "anyio>=4,<5",
    "ruff>=0.12,<1",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "pillow>=10,<13",
    "aec-sources",
    "aec-rag",
    "aec-roster",
]

[tool.pytest.ini_options]
# `plugins/` — плагины ядра hermes (задача 5.3), а не MCP-серверы: их не ставят
# в venv, а копируют в профиль целиком. Поэтому они НЕ члены uv-workspace выше
# (`members = ["mcp/*"]` их не захватывает) и живут отдельной строкой здесь.
testpaths = ["mcp", "plugins"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The agent toolkit (.agents/, its .claude/ mirror) ships as its authors format it;
# reformatting it would turn every toolkit update into a merge.
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
