[project]
name = "aecpilot"
version = "0.0.0"
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp/*"]

[tool.uv.sources]
aec-sources = { workspace = true }
aec-rag = { workspace = true }

[dependency-groups]
# python-docx builds the DOCX test fixtures. It already arrives transitively
# with docling, but a test must not rest on somebody else's dependency tree —
# that is the trap recorded as D-6.
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "python-docx>=1.2,<2", "aec-sources", "aec-rag"]

[tool.pytest.ini_options]
testpaths = ["mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
